<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Customizer</title>
  <link rel="stylesheet" href="/assets/customizer.css">
</head>
<body>
  <div class="customizer">
    <div class="header">
      <h1>Crypto Ticker Customizer</h1>
      <p>Configure your widget, preview it live, then copy the URL into OBS.</p>
    </div>
    <div class="layout">
      <div class="panel settings-panel">
        <h2 class="panel-title">Settings</h2>
        <div class="field">
          <label class="field-label" for="ids">Coin IDs (comma separated)</label>
          <input type="text" id="ids" class="input" value="bitcoin,ethereum,solana">
        </div>
        <div class="field">
          <label class="field-label" for="w">Width</label>
          <input type="range" id="w" class="input range-input" value="420" min="280" max="640" step="10">
          <span id="w-val">420</span>
        </div>
        <button class="btn btn-primary" id="copy-url">Copy Widget URL</button>
        <button class="btn btn-secondary" id="reset">Restore defaults</button>
      </div>
      <div class="panel preview-panel">
        <h2 class="panel-title">Preview</h2>
        <div id="preview-widget" class="preview-area"></div>
        <div class="field" style="margin-top:12px">
          <label class="field-label">Widget URL</label>
          <div class="url-box">
            <input type="text" id="widget-url" class="url-input" readonly>
            <button class="btn btn-primary" id="copy-url-2" style="width:auto;padding:10px 14px">Copy</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    const defaults = { ids: 'bitcoin,ethereum,solana', w: '420' };
    let cfg = { ...defaults };
    const symbols = { bitcoin: 'BTC', ethereum: 'ETH', solana: 'SOL' };

    function readInputs() {
      cfg.ids = document.getElementById('ids').value.trim();
      cfg.w = document.getElementById('w').value;
      document.getElementById('w-val').textContent = cfg.w;
    }

    function buildUrl() {
      const u = new URL('/widgets/crypto.html', location.origin);
      u.searchParams.set('ids', cfg.ids);
      if (cfg.w !== '420') u.searchParams.set('w', cfg.w);
      return u.toString();
    }

    async function renderPreview() {
      const previewEl = document.getElementById('preview-widget');
      previewEl.innerHTML = '<div style="color:#9ca3af">Loading...</div>';
      try {
        const url = `https://api.coingecko.com/api/v3/simple/price?ids=${cfg.ids}&vs_currencies=usd&include_24hr_change=true`;
        const data = await fetch(url).then(r => r.json());
        const rows = Object.entries(data).map(([coin, info]) => {
          const symbol = symbols[coin] || coin.toUpperCase().slice(0,4);
          const price = info.usd != null ? info.usd.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }) : '--';
          const change = info.usd_24h_change;
          const color = change == null ? '#9ca3af' : change >= 0 ? '#34d399' : '#f87171';
          const arrow = change == null ? '' : change >= 0 ? '▲' : '▼';
          return `<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:0.95em;font-weight:500">
            <span style="font-weight:700">${symbol}</span>
            <span style="font-variant-numeric:tabular-nums;font-weight:700;margin-right:8px">${price}</span>
            <span style="color:${color};font-size:0.85em;font-weight:700;min-width:52px;text-align:right">${arrow} ${change != null ? change.toFixed(1) : '0.0'}%</span>
          </div>`;
        }).join('');
        previewEl.innerHTML = `<div class="widget" style="--w:${cfg.w}px;--p:16px 18px;--r:14px">
          <div style="font-size:0.75em;color:#9ca3af;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px">Crypto</div>
          <div style="color:#e5e7eb">${rows || '<div style="color:#f87171">No data</div>'}</div>
        </div>`;
        document.getElementById('widget-url').value = buildUrl();
      } catch {
        previewEl.innerHTML = '<div style="color:#f87171">CoinGecko unavailable</div>';
        document.getElementById('widget-url').value = '';
      }
    }

    function bind(id, event, fn) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener(event, () => { fn(); renderPreview(); });
    }

    bind('ids', 'input', () => readInputs());
    bind('w', 'input', () => readInputs());

    document.getElementById('copy-url').addEventListener('click', copy);
    document.getElementById('copy-url-2').addEventListener('click', copy);
    document.getElementById('reset').addEventListener('click', () => {
      cfg = { ...defaults };
      document.getElementById('ids').value = defaults.ids;
      document.getElementById('w').value = defaults.w;
      renderPreview();
    });

    function copy() {
      const input = document.getElementById('widget-url');
      if (!input.value) return;
      input.select();
      document.execCommand('copy');
      const btn = document.getElementById('copy-url');
      const btn2 = document.getElementById('copy-url-2');
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      if (btn2) btn2.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = old; if (btn2) btn2.textContent = 'Copy'; }, 1500);
    }

    readInputs();
    renderPreview();
  </script>
</body>
</html>

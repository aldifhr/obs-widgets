<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Customizer</title>
  <link rel="stylesheet" href="/assets/customizer.css">
</head>
<body>
  <div class="customizer">
    <div class="header">
      <h1>Countdown Customizer</h1>
      <p>Configure your widget, preview it live, then copy the URL into OBS.</p>
    </div>
    <div class="layout">
      <div class="panel settings-panel">
        <h2 class="panel-title">Settings</h2>
        <div class="field">
          <label class="field-label" for="label">Label</label>
          <input type="text" id="label" class="input" value="Event">
        </div>
        <div class="field">
          <label class="field-label" for="to">Target ISO Date</label>
          <input type="text" id="to" class="input" value="2026-12-31T23:59:59">
        </div>
        <div class="field">
          <label class="field-label" for="w">Width</label>
          <input type="range" id="w" class="input range-input" value="380" min="280" max="640" step="10">
          <span id="w-val">380</span>
        </div>
        <button class="btn btn-primary" id="copy-url">Copy Widget URL</button>
        <button class="btn btn-secondary" id="reset">Restore defaults</button>
      </div>
      <div class="panel preview-panel">
        <h2 class="panel-title">Preview</h2>
        <div id="preview-widget" class="preview-area"></div>
        <div class="field" style="margin-top:12px">
          <label class="field-label">Widget URL</label>
          <div class="url-box">
            <input type="text" id="widget-url" class="url-input" readonly>
            <button class="btn btn-primary" id="copy-url-2" style="width:auto;padding:10px 14px">Copy</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    const defaults = { label: 'Event', to: '2026-12-31T23:59:59', w: '380' };
    let cfg = { ...defaults };

    function readInputs() {
      cfg.label = document.getElementById('label').value.trim();
      cfg.to = document.getElementById('to').value.trim();
      cfg.w = document.getElementById('w').value;
      document.getElementById('w-val').textContent = cfg.w;
    }

    function buildUrl() {
      const u = new URL('/widgets/countdown.html', location.origin);
      u.searchParams.set('label', cfg.label);
      u.searchParams.set('to', cfg.to);
      if (cfg.w !== '380') u.searchParams.set('w', cfg.w);
      return u.toString();
    }

    function renderPreview() {
      const display = document.getElementById('preview-widget');
      const targetDate = new Date(cfg.to);
      if (!cfg.to || isNaN(targetDate.getTime())) {
        display.innerHTML = '<div class="widget" style="--w:380px;--p:18px 20px;--r:14px"><div style="font-size:1.6em;font-weight:800;color:#f87171">Invalid date</div></div>';
        document.getElementById('widget-url').value = '';
        return;
      }
      display.innerHTML = `<div class="widget" style="--w:${cfg.w}px;--p:18px 20px;--r:14px">
        <div style="font-size:0.75em;color:#9ca3af;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px">${escapeHtml(cfg.label)}</div>
        <div id="countdown-display" style="font-size:1.6em;font-weight:800;letter-spacing:0.5px;line-height:1.2">--:--:--</div>
        <div id="countdown-date" style="font-size:0.8em;color:#9ca3af;margin-top:4px"></div>
      </div>`;
      document.getElementById('countdown-date').textContent = targetDate.toLocaleString();
      document.getElementById('widget-url').value = buildUrl();
      const displayEl = document.getElementById('countdown-display');
      if (window._countdownInterval) clearInterval(window._countdownInterval);
      window._countdownInterval = setInterval(() => {
        const now = new Date();
        let diff = Math.max(0, Math.floor((targetDate.getTime() - now.getTime()) / 1000));
        const d = Math.floor(diff / 86400); diff %= 86400;
        const h = Math.floor(diff / 3600); diff %= 3600;
        const m = Math.floor(diff / 60); const s = diff % 60;
        const parts = [];
        if (d > 0) parts.push(`${d}d`);
        parts.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`);
        if (displayEl) displayEl.textContent = parts.join(' ');
      }, 1000);
    }

    function bind(id, event, fn) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener(event, () => { fn(); renderPreview(); });
    }

    bind('label', 'input', () => readInputs());
    bind('to', 'input', () => readInputs());
    bind('w', 'input', () => readInputs());

    document.getElementById('copy-url').addEventListener('click', copy);
    document.getElementById('copy-url-2').addEventListener('click', copy);
    document.getElementById('reset').addEventListener('click', () => {
      cfg = { ...defaults };
      document.getElementById('label').value = defaults.label;
      document.getElementById('to').value = defaults.to;
      document.getElementById('w').value = defaults.w;
      renderPreview();
    });

    function copy() {
      const input = document.getElementById('widget-url');
      if (!input.value) return;
      input.select();
      document.execCommand('copy');
      const btn = document.getElementById('copy-url');
      const btn2 = document.getElementById('copy-url-2');
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      if (btn2) btn2.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = old; if (btn2) btn2.textContent = 'Copy'; }, 1500);
    }

    readInputs();
    renderPreview();
  </script>
</body>
</html>

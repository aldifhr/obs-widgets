<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valorant Rank Customizer</title>
  <link rel="stylesheet" href="/assets/customizer.css">
  <link rel="stylesheet" href="/assets/widget-BnFGbN4S.css">
</head>
<body>
  <div class="customizer">
    <div class="header">
      <h1>Valorant Rank Customizer</h1>
      <p>Configure your widget, preview it live, then copy the URL into OBS.</p>
    </div>
    <div class="layout">
      <div class="panel settings-panel">
        <h2 class="panel-title">Settings</h2>
        <div class="field">
          <label class="field-label">Riot Name + Tag</label>
          <input type="text" id="name" class="input" placeholder="Name" value="the blessed one">
          <input type="text" id="tag" class="input" placeholder="#Tag" value="one" style="margin-top:8px">
        </div>
        <div class="field">
          <label class="field-label" for="region">Region</label>
          <select id="region" class="input">
            <option value="ap">AP</option>
            <option value="eu">EU</option>
            <option value="na">NA</option>
            <option value="kr">KR</option>
            <option value="latam">LATAM</option>
            <option value="br">BR</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="accent">Accent</label>
          <input type="color" id="accent" class="input color-input" value="#ff4655">
        </div>
        <div class="field">
          <label class="field-label" for="accent-light">Accent Light</label>
          <input type="color" id="accent-light" class="input color-input" value="#ff7b85">
        </div>
        <div class="field">
          <label class="field-label" for="card-width">Card Width <span id="card-width-val">460</span></label>
          <input type="range" id="card-width" class="input range-input" value="460" min="300" max="800" step="10">
        </div>
        <div class="field">
          <label class="field-label" for="font-size">Font Size Scale</label>
          <input type="range" id="font-size" class="input range-input" value="1" min="0.8" max="1.4" step="0.05">
        </div>
        <div class="field">
          <label class="field-label" for="bg-image">Map Background URL</label>
          <input type="text" id="bg-image" class="input" placeholder="https://media.valorant-api.com/maps/...">
        </div>
        <div class="field">
          <label class="field-label" for="bg-opacity">Background Opacity</label>
          <input type="range" id="bg-opacity" class="input range-input" value="0.35" min="0" max="0.8" step="0.05">
        </div>
        <div class="field">
          <label class="field-label" for="refresh">Refresh Interval</label>
          <select id="refresh" class="input">
            <option value="30">30 seconds</option>
            <option value="60">1 minute</option>
            <option value="180">3 minutes</option>
            <option value="300">5 minutes</option>
          </select>
        </div>
        <button class="btn btn-primary" id="copy-url">Copy Widget URL</button>
        <button class="btn btn-secondary" id="reset">Restore defaults</button>
      </div>
      <div class="panel preview-panel">
        <h2 class="panel-title">Preview</h2>
        <div id="preview-widget" class="preview-area"></div>
        <div class="field" style="margin-top:12px">
          <label class="field-label">Widget URL</label>
          <div class="url-box">
            <input type="text" id="widget-url" class="url-input" readonly>
            <button class="btn btn-primary" id="copy-url-2" style="width:auto;padding:10px 14px">Copy</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    const HDEV = 'HDEV-87eff0e8-c336-4f1b-add1-366cc3661975';

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function buildUrl(config) {
      const u = new URL('/widgets/valorant.html', location.origin);
      u.searchParams.set('name', config.name);
      u.searchParams.set('tag', config.tag);
      u.searchParams.set('region', config.region);
      if (config.accent !== '#ff4655') u.searchParams.set('accent', config.accent);
      if (config.accentLight !== '#ff7b85') u.searchParams.set('accentLight', config.accentLight);
      if (config.cardWidth !== 460) u.searchParams.set('cardWidth', String(config.cardWidth));
      if (config.fontSizeScale !== 1) u.searchParams.set('fontSizeScale', String(config.fontSizeScale));
      if (config.bgImage) u.searchParams.set('bgImage', config.bgImage);
      if (config.bgOpacity !== 0.35) u.searchParams.set('bgOpacity', String(config.bgOpacity));
      if (config.refreshInterval !== 60) u.searchParams.set('refresh', String(config.refreshInterval));
      return u.toString();
    }

    async function fetchMmr(name, tag, region) {
      const r = await fetch(`https://api.henrikdev.xyz/valorant/v2/mmr/${encodeURIComponent(region)}/${encodeURIComponent(name)}/${encodeURIComponent(tag)}`, { headers: { Authorization: HDEV } });
      if (!r.ok) throw new Error('Henrik API error ' + r.status);
      const j = await r.json();
      return { tier: j.data.current_data.currenttierpatched, tierNumber: j.data.current_data.currenttier, rr: j.data.current_data.ranking_in_tier, images: j.data.current_data.images };
    }

    const defaults = { name: 'the blessed one', tag: 'one', region: 'ap', accent: '#ff4655', accentLight: '#ff7b85', cardWidth: 460, fontSizeScale: 1, bgImage: '', bgOpacity: 0.35, refreshInterval: 60 };
    let config = { ...defaults };

    function readInputs() {
      config.name = document.getElementById('name').value.trim();
      config.tag = document.getElementById('tag').value.trim();
      config.region = document.getElementById('region').value;
      config.accent = document.getElementById('accent').value;
      config.accentLight = document.getElementById('accent-light').value;
      config.cardWidth = parseInt(document.getElementById('card-width').value || '460', 10);
      config.fontSizeScale = parseFloat(document.getElementById('font-size').value || '1');
      config.bgImage = document.getElementById('bg-image').value.trim();
      config.bgOpacity = parseFloat(document.getElementById('bg-opacity').value || '0.35');
      config.refreshInterval = parseInt(document.getElementById('refresh').value || '60', 10);
    }

    function updateVal() {
      document.getElementById('card-width-val').textContent = String(config.cardWidth);
    }

    async function renderPreview() {
      const previewEl = document.getElementById('preview-widget');
      if (!config.name || !config.tag) {
        previewEl.innerHTML = '<div style="color:#9ca3af">Enter name + tag</div>';
        document.getElementById('widget-url').value = '';
        return;
      }
      previewEl.innerHTML = '<div style="color:#9ca3af">Loading...</div>';
      try {
        const data = await fetchMmr(config.name, config.tag, config.region);
        previewEl.innerHTML = `
          <div class="widget-page" style="background:transparent">
            <div class="widget" style="--accent:${config.accent};--accent-light:${config.accentLight};--card-width:${config.cardWidth}px;--font-scale:${config.fontSizeScale};background-image:url('${config.bgImage || 'none'}');background-size:cover;background-position:center;background-repeat:no-repeat">
              <div style="position:relative;z-index:1">
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <div style="color:#e5e7eb;font-size:.875em;font-weight:700;letter-spacing:.3px">${escapeHtml(config.name)}<span style="color:#6b7280;margin-left:6px;font-size:.75em;font-weight:500">#${escapeHtml(config.tag)}</span></div>
                </div>
                <div style="display:flex;align-items:center;gap:18px;margin-top:16px">
                  <div style="flex-shrink:0;width:84px;height:84px;position:relative"><img src="${data.images.small}" alt="rank" style="width:100%;height:100%;filter:drop-shadow(0 4px 14px rgba(0,0,0,0.5))" /></div>
                  <div style="font-size:1.875em;font-weight:800;letter-spacing:.5px;line-height:1.1;text-shadow:0 2px 16px rgba(255,70,85,0.35)">${escapeHtml(data.tier)}</div>
                </div>
                <div style="margin-top:18px">
                  <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:.6875em;color:#9ca3af;font-weight:600;margin-bottom:.5em">
                    <span>RR Progress</span>
                    <span style="color:${config.accent};font-variant-numeric:tabular-nums;font-size:1.0625em;font-weight:800">${data.rr} <small style="color:#6b7280;font-size:.6875em;font-weight:600">/ 100</small></span>
                  </div>
                  <div style="background:#ffffff1a;border-radius:99px;height:8px;position:relative;overflow:hidden">
                    <div style="background:linear-gradient(90deg,${config.accent},${config.accentLight});width:${data.rr}%;height:100%;box-shadow:0 0 12px rgba(255,70,85,0.8);border-radius:99px"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        document.getElementById('widget-url').value = buildUrl(config);
      } catch (e) {
        previewEl.innerHTML = `<div style="color:#f87171">Gagal fetch data</div>`;
        document.getElementById('widget-url').value = '';
      }
    }

    function bind(id, event, fn) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener(event, () => { fn(); updateVal(); renderPreview(); });
    }

    bind('name', 'input', () => readInputs());
    bind('tag', 'input', () => readInputs());
    bind('region', 'change', () => readInputs());
    bind('accent', 'input', () => readInputs());
    bind('accent-light', 'input', () => readInputs());
    bind('card-width', 'input', () => readInputs());
    bind('font-size', 'input', () => readInputs());
    bind('bg-image', 'input', () => readInputs());
    bind('bg-opacity', 'input', () => readInputs());
    bind('refresh', 'change', () => readInputs());

    document.getElementById('copy-url').addEventListener('click', copy);
    document.getElementById('copy-url-2').addEventListener('click', copy);
    document.getElementById('reset').addEventListener('click', () => {
      config = { ...defaults };
      document.getElementById('name').value = defaults.name;
      document.getElementById('tag').value = defaults.tag;
      document.getElementById('region').value = defaults.region;
      document.getElementById('accent').value = defaults.accent;
      document.getElementById('accent-light').value = defaults.accentLight;
      document.getElementById('card-width').value = defaults.cardWidth;
      document.getElementById('font-size').value = defaults.fontSizeScale;
      document.getElementById('bg-image').value = defaults.bgImage;
      document.getElementById('bg-opacity').value = defaults.bgOpacity;
      document.getElementById('refresh').value = defaults.refreshInterval;
      updateVal();
      renderPreview();
    });

    function copy() {
      const input = document.getElementById('widget-url');
      if (!input.value) return;
      input.select();
      document.execCommand('copy');
      const btn = document.getElementById('copy-url');
      const btn2 = document.getElementById('copy-url-2');
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      if (btn2) btn2.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = old; if (btn2) btn2.textContent = 'Copy'; }, 1500);
    }

    readInputs();
    updateVal();
    renderPreview();
  </script>
</body>
</html>

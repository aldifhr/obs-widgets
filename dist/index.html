<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>obs.aldifhr.fun</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    :root {
      --bg: #08090c;
      --panel: #0f1115;
      --panel-2: #14171c;
      --line: #1f232b;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    .topbar {
      border-bottom: 1px solid var(--line);
      padding: 18px 0 22px;
      margin-bottom: 36px;
    }

    .domain {
      font-size: 1.35em;
      font-weight: 900;
      letter-spacing: -0.3px;
    }

    .tagline {
      font-size: 0.78em;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .tile {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      text-decoration: none;
      color: #fff;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      display: block;
    }

    .tile:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.16);
      background: var(--panel-2);
    }

    .tile h3 {
      font-size: 1.05em;
      font-weight: 800;
      margin: 0 0 6px;
    }

    .tile p {
      color: var(--muted);
      font-size: 0.85em;
      margin: 0;
      line-height: 1.4;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .footer {
      margin-top: 40px;
      border-top: 1px solid var(--line);
      padding-top: 18px;
      color: #6b7280;
      font-size: 0.78em;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="domain">obs.aldifhr.fun</div>
      <div class="tagline">Valorant · OBS Widgets</div>
    </div>

    <div class="row">
      <a class="tile" href="/valorant.html">
        <h3>Valorant Rank</h3>
        <p>Live competitive rank, RR progress, rank icon, map background.</p>
      </a>
      <a class="tile" href="/customizer/valorant.html">
        <h3>Valorant Customizer</h3>
        <p>Configure colors, width, background, and copy the final URL.</p>
      </a>
    </div>

    <div class="footer">
      Paste a widget URL into OBS Browser Source.
    </div>
  </div>
</body>
</html>
